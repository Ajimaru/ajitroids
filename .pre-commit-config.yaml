# Pre-commit Hooks Configuration
# Automatically enforces code quality, linting, and formatting standards
# on every commit to maintain consistency across the codebase.
#
# Setup:
#   pip install pre-commit
#   pre-commit install
#
# Manual run:
#   pre-commit run --all-files
#
# See https://pre-commit.com for more information.

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file
      - id: check-yaml
        name: Check YAML syntax
        # mkdocs.yml is excluded rather than passing --unsafe globally: it
        # legitimately needs `!!python/name:pymdownx...` for the mermaid
        # superfence, and --unsafe would weaken the check for every other
        # file (the workflows above all). `mkdocs build --strict` in the docs
        # workflow validates mkdocs.yml properly anyway.
        exclude: ^mkdocs\.yml$
      - id: check-ast
        name: Check Python AST

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: flake8 (style guide enforcement)
        # No inline args: the repo-wide .flake8 config is the single source of
        # truth for line length and ignores. Passing --max-line-length=79 here
        # contradicted .flake8 (127) and made `pre-commit run --all-files`
        # fail with 578 errors on a clean checkout.
        #
        # tests/ and scripts/ are excluded to match the pylint hook below.
        # Test code legitimately assigns results it never asserts on (F841)
        # and imports after sys.path tweaks (E402); the one-off helper scripts
        # are not shipped. Product code (modul/, main.py) is linted strictly.
        exclude: |
          (?x)^(
            setup.py|
            conftest.py|
            tests/|
            scripts/
          )

  # Python code analysis with pylint
  - repo: https://github.com/pycqa/pylint
    rev: v3.2.6
    hooks:
      - id: pylint
        name: pylint (code analysis)
        types: [python]
        args:
          - "--disable=C0114,C0115,C0116"
          - "--max-line-length=127"
          # Advisory for now: product code still has ~103 style/refactor
          # messages (mostly `wrong-import-position`, a side effect of the
          # constants shim at the top of main.py, plus `consider-using-in`
          # and friends). Report them without blocking the commit; drop this
          # flag once the backlog is worked off so regressions start failing.
          - "--exit-zero"
        # No trailing `$`: with it, the `tests/` entry only matched a file
        # literally named "tests/", so test files were linted anyway and this
        # hook could never pass. Anchoring at the start is what excludes a
        # whole directory.
        exclude: |
          (?x)^(
            setup.py|
            conftest.py|
            tests/|
            scripts/
          )

  # Markdown formatting with prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (markdown formatting)
        types: [markdown]
        args: ["--prose-wrap=always"]
        exclude: |
          (?x)^(docs/api/python\.md)$

  # Project-local checks
  - repo: local
    hooks:
      # This project uses plain JSON locale files, not gettext. A key missing
      # from a translation falls back to English silently, so compare the
      # catalogs explicitly.
      #
      # `language: python` lets pre-commit build and cache the hook's own
      # interpreter, so these run identically on Linux, macOS and Windows
      # without a project venv being active. A `language: system` entry would
      # inherit the caller's PATH instead, which breaks whenever a commit is
      # made from an IDE or git GUI that never activated .venv.
      - id: check-locales
        name: check locale catalogs are in sync
        entry: python scripts/check_locales.py
        language: python
        # Stdlib only - no additional_dependencies needed.
        pass_filenames: false
        files: ^modul/locales/.*\.json$

      # Run the full test suite before committing
      - id: pytest
        name: pytest (all files)
        entry: pytest
        language: python
        # pre-commit builds an isolated env for this hook, so the runtime
        # dependencies the tests import must be declared here; they are not
        # picked up from requirements.txt.
        additional_dependencies:
          - pytest>=7.0.0
          - pygame>=2.1.0
          - numpy>=2.2.6
          - PyOpenGL==3.1.10
          - pyttsx3>=2.99
          - markdown>=3.10.3
        pass_filenames: false
