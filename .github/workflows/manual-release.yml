name: Manual Release Creation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.21.0)'
        required: true
        type: string
      ref:
        description: 'Branch or commit to tag (default: release/{tag})'
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag format
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Tag must follow semantic versioning format (e.g., v0.21.0)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || format('release/{0}', github.event.inputs.tag) }}
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag already exists remotely
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag already exists remotely, skipping tag creation"
          else
            echo "Creating and pushing tag"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
      ref: refs/tags/${{ inputs.tag }}
