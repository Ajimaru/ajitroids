# Bandit configuration.
#
# B311 (random) is skipped repo-wide: this is a game, and every use of the
# `random` module drives gameplay — asteroid velocities, starfield layout,
# particle spread, powerup drop chance, enemy spawn timing. None of it is
# used for tokens, passwords, keys or anything else security-relevant, so
# the "not suitable for cryptographic purposes" note is noise. It fired 51
# times and annotated unrelated pull requests with review comments.
#
# B110 (try/except/pass) and B112 (try/except/continue) are skipped repo-wide
# too. Every instance sits on an optional subsystem: TTS voice enumeration,
# engine voice selection, per-voice language parsing in the options menu, and
# the sound device probe. Swallowing the error is the intended behaviour -
# the feature degrades to "no extra voice entries" or "keep the previous
# value" instead of taking the game down because a speech driver is missing.
# pyproject.toml documents the same reasoning for pylint's
# `broad-exception-caught`. These are notes, not exploitable findings.
#
# Everything else stays enabled. If a new try/except/pass guards anything
# other than an optional device or driver, fix the code instead of extending
# this list. If cryptographic randomness is ever needed (it is not today),
# use `secrets` and drop the B311 skip.
skips:
  - B311
  - B110
  - B112

exclude_dirs:
  - ./tests
  - ./scripts
  - ./.venv
  - ./venv
  - ./build
  - ./dist
