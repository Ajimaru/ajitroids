[tool.pylint.messages_control]
disable = [
  "fixme",
  "too-many-lines",
  "too-many-arguments",
  "too-many-branches",
  "too-many-statements",
  "too-many-instance-attributes",
  "too-many-locals",
  "duplicate-code",
  # main.py injects the uppercase names from modul.constants into its module
  # globals at import time (a deliberate backwards-compatibility shim), which
  # pylint cannot follow statically. It reports ~68 false "undefined-variable"
  # plus the matching "global-variable-undefined" for names that resolve fine
  # at runtime. flake8 ignores the same thing via F405.
  "undefined-variable",
  "global-variable-undefined",
  # Size/shape advice, not correctness. The game loop and menu classes are
  # deliberately large; splitting them is a refactor, not a lint fix.
  "too-many-public-methods",
  "too-few-public-methods",
  "too-many-positional-arguments",
  "too-many-nested-blocks",
  "too-many-return-statements",
  # Local imports are used on purpose to keep pygame/TTS optional and to break
  # import cycles between modul.menu and modul.i18n.
  "import-outside-toplevel",
  # Broad excepts guard optional runtime features (TTS, audio devices, replay
  # files) where any failure must degrade gracefully rather than crash.
  "broad-exception-caught",
]

[tool.pylint.format]
ignore-patterns = ["modul/_version.py"]
max-line-length = 127

[tool.black]
line-length = 127
target-version = ["py39", "py310", "py311", "py312"]

# NOTE: flake8 does not read pyproject.toml, so its settings live in .flake8
# at the repo root (max-line-length = 127, extend-ignore = E128,F405). Keeping
# a [tool.flake8] table here only invites the two drifting apart.

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
testpaths = ["tests"]
filterwarnings = [
  "ignore:pkg_resources is deprecated as an API:UserWarning",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "modul/_version.py"
fallback_version = "0.24.0"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "flake8>=7.0",
    "black>=24.0",
]

[project]
name = "ajitroids"
dynamic = ["version"]
description = "Another Asteroids"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    "pygame==2.6.1",
]
authors = [
  { name = "Ajimaru", email = "ajitroids@noreply.github.com" }
]
license = { text = "MIT" }
keywords = ["asteroids", "pygame", "space", "game"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
  "License :: OSI Approved :: MIT License"
]

[project.urls]
"Homepage" = "https://github.com/Ajimaru/ajitroids"
"Bug Tracker" = "https://github.com/Ajimaru/ajitroids/issues"

[project.scripts]
ajitroids = "main:main"
